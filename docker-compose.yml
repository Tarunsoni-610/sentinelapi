services:
  sandbox-api:
    build: ./sandbox-api
    container_name: sentinel-sandbox
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      SANDBOX_CONTROL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  scanner:
    build: ./scanner
    container_name: sentinel-scanner
    ports:
      - "5000:5000"
    environment:
      SCANNER_PORT: "5000"
      TARGET_URL: "http://sandbox-api:4000"
      ALLOWED_TARGETS: "localhost,127.0.0.1,sandbox-api,sentinel-sandbox"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      sandbox-api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: sentinel-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - scanner
    restart: unless-stopped